[project]
name = "etf-history"
version = "0.1.0"
description = "Daily holdings history of emerging-markets value ETFs (DFEV, AVES) with Streamlit dashboards"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
# Collection needs only these (pure Python: runs on a 32-bit Raspberry Pi 1); the dashboard is an extra because
# pyarrow (required by Streamlit) has no 32-bit ARM wheels.
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.27.2",
]

[project.optional-dependencies]
dashboard = [
    "pandas>=2.3",
    "plotly>=6.0",
    "streamlit>=1.50",
]

[project.scripts]
etf-history = "etf_history.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etf_history"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]
