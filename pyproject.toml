[project]
name = "etf-history"
version = "0.1.0"
description = "Daily holdings history of Dimensional ETFs (DFEV) with Streamlit dashboards"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=2.3",
    "plotly>=6.0",
    "streamlit>=1.50",
    "typer>=0.27.2",
]

[project.scripts]
etf-history = "etf_history.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etf_history"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]
